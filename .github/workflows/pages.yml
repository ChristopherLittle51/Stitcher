name: Deploy Stitcher to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check cipher.js
          node --check app.js
          node --check classic.js
          node --check classic-beauty.js
          node --check classic-patch.js
          node --check classic-ui.js
          node --check classic-mobile.js

      - name: Smoke test Classic codec
        run: |
          node <<'NODE'
          global.window = {};
          require('./classic.js');
          require('./classic-beauty.js');
          require('./classic-patch.js');
          const C = global.window.StitcherClassic;
          const challenge = C.buildChallenge('Classic test', 'MEET ME AFTER MIDNIGHT', 'BRING THE KEY', 0);
          const encoded = C.encodePayload(challenge, {includeTitle: true});
          const decoded = C.decodePayload(encoded);
          const expected = C.expectedMessages(decoded);
          if (expected.line !== 'MEET ME AFTER MIDNIGHT') throw new Error(`Classic stitch round trip failed: ${expected.line}`);
          if (expected.color !== 'BRING THE KEY') throw new Error(`Classic shade round trip failed: ${expected.color}`);

          const allRegions = C.enclosedRegions(decoded.hPhases, decoded.vPhases);
          const surfaceRegions = C.surfaceRegions(allRegions);
          const neededSurfaceBits = decoded.colorLength * 5;
          if (surfaceRegions.length < neededSurfaceBits) throw new Error(`Classic generator only created ${surfaceRegions.length} substantial motifs for ${neededSurfaceBits} shade bits.`);
          if (surfaceRegions.some(region => region.cells.length < C.MIN_SURFACE_AREA)) throw new Error('Classic surface stream contains a tiny pocket.');

          const rendered = C.svgMarkup(decoded);
          if (rendered.regions.length !== surfaceRegions.length) throw new Error('Classic renderer and surface motif selection disagree.');
          if (!Array.isArray(rendered.motifHues) || rendered.motifHues.length !== surfaceRegions.length) throw new Error('Classic motif hue assignment is incomplete.');
          if (surfaceRegions.length && !rendered.svg.includes('data-motif-hue=')) throw new Error('Classic renderer is not using motif-aware hues.');
          if (surfaceRegions.length > 2 && new Set(rendered.motifHues).size < 2) throw new Error('Classic motif hues did not produce both decorative colors.');

          const stitchOnly = C.buildChallenge('Stitch only', 'HELLO', '', 0);
          const stitchOnlyAll = C.enclosedRegions(stitchOnly.hPhases, stitchOnly.vPhases);
          const stitchOnlySurface = C.surfaceRegions(stitchOnlyAll);
          if (stitchOnly.colorLength !== 0 || stitchOnly.surfaceBits.length !== 0) throw new Error('Stitch-only fallback leaked placeholder surface data.');
          if (stitchOnlySurface.length < 5) throw new Error('Stitch-only Classic puzzle did not preserve substantial enclosed motifs.');

          const avgArea = surfaceRegions.reduce((sum,r)=>sum+r.cells.length,0)/Math.max(1,surfaceRegions.length);
          console.log(`Classic smoke test passed: ${decoded.hPhases.length}x${decoded.vPhases.length} tracks, ${allRegions.length} total enclosures, ${surfaceRegions.length} substantial surface motifs, avg motif area ${avgArea.toFixed(2)}.`);
          NODE

      - name: Assemble site
        run: python3 assemble-site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
