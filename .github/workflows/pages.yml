name: Deploy Stitcher to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check cipher.js
          node --check app.js
          node --check classic.js
          node --check classic-beauty.js
          node --check classic-ground.js
          node --check classic-patch.js
          node --check classic-ui.js
          node --check classic-mobile.js

      - name: Smoke test Classic codec
        run: |
          node <<'NODE'
          global.window = {};
          require('./classic.js');
          require('./classic-beauty.js');
          require('./classic-ground.js');
          require('./classic-patch.js');
          const C = global.window.StitcherClassic;
          const challenge = C.buildChallenge('Classic test', 'MEET ME AFTER MIDNIGHT', 'BRING THE KEY', 0);
          const encoded = C.encodePayload(challenge, {includeTitle: true});
          const decoded = C.decodePayload(encoded);
          const expected = C.expectedMessages(decoded);
          if (expected.line !== 'MEET ME AFTER MIDNIGHT') throw new Error(`Classic stitch round trip failed: ${expected.line}`);
          if (expected.color !== 'BRING THE KEY') throw new Error(`Classic shade round trip failed: ${expected.color}`);

          const allRegions = C.enclosedRegions(decoded.hPhases, decoded.vPhases);
          const eligible = C.surfaceRegions(allRegions);
          const neededSurfaceBits = decoded.colorLength * 5;
          if (eligible.length < neededSurfaceBits) throw new Error(`Classic generator only created ${eligible.length} substantial motifs for ${neededSurfaceBits} shade bits.`);
          if (eligible.some(region => region.cells.length < C.MIN_SURFACE_AREA)) throw new Error('Classic surface stream contains a tiny pocket.');

          const rendered = C.svgMarkup(decoded);
          const palette = C.PALETTES[decoded.palette];
          if (!palette.ground) throw new Error('Classic palette is missing its third ground hue.');
          if ([palette.aLight,palette.aDark,palette.bLight,palette.bDark].includes(palette.ground)) throw new Error('Classic ground hue is not visually distinct from foreground hues.');
          if (rendered.groundHue !== palette.ground) throw new Error('Classic renderer did not use the palette ground hue.');
          if (!rendered.svg.includes('class="classic-ground-field"')) throw new Error('Classic ground field is missing.');
          if (!rendered.svg.includes(`fill="${palette.ground}"`)) throw new Error('Classic ground field does not use the third hue.');
          if (rendered.regions.length !== neededSurfaceBits) throw new Error(`Classic renderer exposed ${rendered.regions.length} foreground motifs for ${neededSurfaceBits} shade bits.`);
          if (neededSurfaceBits>1 && new Set(rendered.motifHues).size < 2) throw new Error('Classic foreground motifs did not use both decorative hues.');
          if (neededSurfaceBits && !rendered.svg.includes('classic-region-cell')) throw new Error('Classic shade-bearing foreground motifs are missing.');

          const stitchOnly = C.buildChallenge('Stitch only', 'HELLO', '', 0);
          const stitchOnlyAll = C.enclosedRegions(stitchOnly.hPhases, stitchOnly.vPhases);
          const stitchOnlySurface = C.surfaceRegions(stitchOnlyAll);
          const stitchOnlyRendered = C.svgMarkup(stitchOnly);
          if (stitchOnly.colorLength !== 0 || stitchOnly.surfaceBits.length !== 0) throw new Error('Stitch-only fallback leaked placeholder surface data.');
          if (stitchOnlySurface.length < 5) throw new Error('Stitch-only Classic puzzle did not preserve substantial enclosed motifs.');
          if (stitchOnlyRendered.regions.length !== 0) throw new Error('Stitch-only Classic puzzle exposed false shade-data motifs.');
          if (!stitchOnlyRendered.svg.includes('classic-ground-field')) throw new Error('Stitch-only Classic puzzle lost the third-hue ground.');

          const avgArea = eligible.reduce((sum,r)=>sum+r.cells.length,0)/Math.max(1,eligible.length);
          console.log(`Classic smoke test passed: ${decoded.hPhases.length}x${decoded.vPhases.length} tracks, ${rendered.regions.length} foreground shade motifs over third-hue ground, avg eligible motif area ${avgArea.toFixed(2)}.`);
          NODE

      - name: Assemble site
        run: python3 assemble-site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
